<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大富翁班級抽籤系統 | 歡樂課堂互動</title>
  <meta name="description" content="明亮色彩大富翁棋盤式學生抽籤與愛心計分系統，具備流暢擲骰動畫、Web Audio 內建音效、機會命運特殊事件與名單下載匯出。">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 全螢幕彩帶碎紙特效畫布 -->
  <canvas id="confetti-canvas"></canvas>

  <!-- 頂部功能導覽列 -->
  <header class="navbar">
    <div class="brand-section">
      <div class="brand-icon">🎲</div>
      <h1 class="brand-title">大富翁課堂抽籤系統</h1>
      <span class="class-badge" id="class-name-badge">102班</span>
    </div>

    <div class="nav-actions">
      <button class="nav-btn primary" id="btn-download-list" title="下載名單與分數清單文字檔">
        <span>📥</span> 下載成績清單
      </button>
      <button class="nav-btn" id="btn-sound-toggle" title="切換音效開關">
        <span>🔊</span> 音效開
      </button>
      <button class="nav-btn" id="btn-open-settings" title="自訂班級、名單與姓名遮罩">
        <span>⚙️</span> 設定
      </button>
    </div>
  </header>

  <!-- 主遊戲大富翁棋盤區 -->
  <main class="main-wrapper">
    <div class="board-container" id="game-board">

      <!-- 中央控制台 (佔據 9x9 區域) -->
      <div class="board-center">
        <!-- 頂部資訊列 -->
        <div class="center-top-bar">
          <div class="center-title">
            <span>✨</span> 課堂幸運輪盤
          </div>
          <div class="quick-stats">
            <div class="stat-pill" title="已抽籤總次數">
              <span>🎯 抽籤次數：</span>
              <strong id="stat-total-drawn">0 次</strong>
            </div>
            <div class="stat-pill" title="全班目前累積愛心總分">
              <span>💖 全班總分：</span>
              <strong id="stat-total-score">0 ❤️</strong>
            </div>
          </div>
        </div>

        <!-- 骰子與操作主舞台 -->
        <div class="dice-stage-container">
          <div class="dice-mode-group">
            <button class="mode-btn active" data-dice="1">單顆骰子 (1-6)</button>
            <button class="mode-btn" data-dice="2">雙顆骰子 (2-12)</button>
          </div>

          <!-- 3D 骰子視覺容器 -->
          <div class="dice-wrapper">
            <!-- 骰子 1 -->
            <div class="cube" id="dice-1">
              <div class="cube-face face-1"><span class="dot red"></span></div>
              <div class="cube-face face-2"><span class="dot"></span><span class="dot"></span></div>
              <div class="cube-face face-3"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
              <div class="cube-face face-4"><span class="dot red"></span><span class="dot red"></span><span class="dot red"></span><span class="dot red"></span></div>
              <div class="cube-face face-5"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
              <div class="cube-face face-6"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
            </div>

            <!-- 骰子 2 (預設隱藏) -->
            <div class="cube" id="dice-2" style="display: none;">
              <div class="cube-face face-1"><span class="dot red"></span></div>
              <div class="cube-face face-2"><span class="dot"></span><span class="dot"></span></div>
              <div class="cube-face face-3"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
              <div class="cube-face face-4"><span class="dot red"></span><span class="dot red"></span><span class="dot red"></span><span class="dot red"></span></div>
              <div class="cube-face face-5"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
              <div class="cube-face face-6"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
            </div>
          </div>

          <!-- 擲骰抽籤大按鈕 -->
          <button class="btn-roll" id="btn-roll">
            <span>🎲</span> 擲骰子抽籤 (Space)
          </button>
        </div>

        <!-- 底部抽籤歷史 -->
        <div class="center-bottom-bar">
          <span class="recent-history-label">🕒 最近抽出：</span>
          <div class="recent-history-tags" id="history-tags">
            <span class="history-tag">尚無抽籤紀錄</span>
          </div>
        </div>
      </div>

      <!-- 棋盤四周的 40 個格子（由 app.js 動態精準渲染） -->

    </div>
  </main>

  <!-- =========================================================
       1. 學生抽中結果彈窗
       ========================================================= -->
  <div class="modal-overlay" id="result-modal">
    <div class="modal-card">
      <div class="result-header">
        <div class="result-title">🎉 恭喜幸運抽中！</div>
      </div>
      <div class="result-body">
        <div class="winner-avatar-box" id="winner-avatar">🎓</div>
        <div class="winner-info">
          <div class="winner-seat" id="winner-seat">座號 No. 1</div>
          <div class="winner-name" id="winner-name">王○晴</div>
          <div class="winner-score-display">
            <span>現有愛心：</span>
            <span id="winner-score">0</span>
            <span>❤️</span>
          </div>
        </div>

        <!-- 愛心調整按鈕組 -->
        <div class="score-action-group">
          <button class="btn-score-act plus" id="btn-plus-1" title="增加 1 顆愛心">
            <span>❤️</span> +1
          </button>
          <button class="btn-score-act plus-bonus" id="btn-plus-5" title="表現優異大獎勵 +5">
            <span>🌟</span> +5
          </button>
          <button class="btn-score-act minus" id="btn-minus-1" title="扣除 1 顆愛心">
            <span>💔</span> -1
          </button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-modal-close btn-close-modal">確認完成</button>
      </div>
    </div>
  </div>

  <!-- =========================================================
       2. 特殊事件（機會 / 命運 / 角落大獎）彈窗
       ========================================================= -->
  <div class="modal-overlay" id="event-modal">
    <div class="modal-card">
      <div class="event-card-header chance" id="event-modal-header">
        <div class="result-title" id="event-title">🎲 班級機會事件</div>
      </div>
      <div class="event-content-box">
        <div class="event-icon-big" id="event-icon">📖</div>
        <div class="event-description" id="event-desc">
          主動朗讀下一段課文，表現優異獲得愛心獎勵！
        </div>
        <div class="event-reward-tag" id="event-reward">
          獎勵：+3 ❤️ 愛心
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-modal-close btn-close-modal">太棒了！</button>
      </div>
    </div>
  </div>

  <!-- =========================================================
       3. 班級與學生設定彈窗 (Settings Modal)
       ========================================================= -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal-card settings-modal-card">
      <div class="settings-header">
        <div class="settings-title">
          <span>⚙️</span> 班級與學生名單設定
        </div>
        <button class="nav-btn btn-close-modal" style="padding: 4px 10px;">✕</button>
      </div>
      <div class="settings-content">
        <!-- 班級名稱 -->
        <div class="setting-item">
          <label class="setting-label" for="input-class-name">班級名稱</label>
          <input type="text" id="input-class-name" class="setting-input" value="102班" placeholder="請輸入班級名稱">
        </div>

        <!-- 姓名隱私遮罩開關 -->
        <div class="setting-item">
          <div class="setting-label">
            <span>姓名隱私遮罩 (○)</span>
            <label class="switch-container">
              <input type="checkbox" id="switch-mask" class="switch-input" checked>
              <div class="switch-track">
                <div class="switch-thumb"></div>
              </div>
            </label>
          </div>
          <p class="setting-help">開啟後，學生姓名將自動以「○」遮蔽中間字以保護學生隱私。</p>
        </div>

        <!-- 學生名單編輯與匯入 -->
        <div class="setting-item">
          <label class="setting-label" for="input-student-list">
            <span>學生名單（每行一位，可包含座號）</span>
          </label>
          <textarea id="input-student-list" class="setting-textarea" placeholder="例如：
1 王大明
2 李小華
3 張同學"></textarea>
          <p class="setting-help">支援 36 位或任意人數。不足 36 位時，剩餘格子將自動由「機會」與「命運」特殊格填補。</p>
        </div>

        <!-- 分數重設 -->
        <div class="setting-item" style="padding-top: 8px;">
          <button type="button" class="nav-btn" id="btn-reset-scores" style="color: #ef4444; border-color: #fca5a5;">
            <span>🔄</span> 重設所有學生愛心分數為 0
          </button>
        </div>
      </div>

      <div class="settings-btn-group">
        <button class="nav-btn btn-close-modal">取消</button>
        <button class="nav-btn primary" id="btn-save-settings">儲存並更新棋盤</button>
      </div>
    </div>
  </div>

  <!-- 引入音效與主腳本 -->
  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
